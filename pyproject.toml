[project]
name = "paperholo"
version = "0.0.1"
description = "Fiducial-free holographic data storage on laser-printed paper"
requires-python = ">=3.11"
# INERT metadata: paperholo is never installed (see the note below), so
# nothing resolves these. requirements.txt at the repo root is the single
# source of truth for the one venv (`env/`, free-threaded 3.14); these
# mirror its floors only so the two files cannot silently disagree.
dependencies = ["numpy>=2.5.2", "scipy>=1.18.1", "pillow>=12", "cryptography>=50"]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-xdist>=3", "pyflakes>=3", "mypy>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Neither holo nor paperholo is pip-installed: both import from src/
# directly (pytest pythonpath below + repo-root conftest.py exporting
# PYTHONPATH to subprocesses; ./confetti.py and src/holo/cli.py
# self-locate). Standalone scripts run as `PYTHONPATH=src env/bin/python
# …`. KISS ruling 2026-07-19; env honesty 2026-07-30.
[tool.setuptools.packages.find]
where = ["src"]
include = ["paperholo*"]

[tool.pytest.ini_options]
# --dist loadgroup: xdist_group marks (tests/ modules that regenerate a shared
# experiment build in place) run on one worker; every other test takes its
# MODULE as its group (repo-root conftest.py), so session fixtures are built
# once per module, not once per worker.
# -n 8 is the default everywhere; -n 0 runs serially for debugging/pdb. The
# paperholo lane (tests/, changed or run rarely per Germano's 2026-09-06
# ruling) is not in testpaths below and is explicit:
# `env/bin/python -m pytest tests --ignore=tests/holo -q`.
# 2026-09-06: paperholo dropped from testpaths, -n 8 added as the default.
addopts = "-n 8 --dist loadgroup"
testpaths = ["tests/holo", "analyzer/tests", "util/tests"]
pythonpath = ["src"]
